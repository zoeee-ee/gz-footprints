<style>

.pin:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fffaf0;opacity:.9}

.lbl.r{display:block;left:12px;top:-10px}.lbl.l{display:block;right:12px;top:-10px}.lbl.t{display:block;left:50%;transform:translateX(-50%);bottom:15px}.lbl.b{display:block;left:50%;transform:translateX(-50%);top:15px}
.cal .lbl{border-color:var(--amber)}.cal .legend{display:none}
.pw.sel .lbl,.pw.dragw .lbl{background:#2a2620;color:#fff;border-color:#2a2620;z-index:5}

#lens{display:none;position:absolute;bottom:12px;width:140px;height:140px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 14px #000a;z-index:9;pointer-events:none;background:#fff}

.zoomc{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4}

.legend{position:absolute;left:10px;bottom:12px;background:#fffaf0ee;border:1px solid #bfb299;border-radius:5px;padding:6px 10px;font:12px system-ui,sans-serif;display:flex;gap:12px;z-index:4;color:#4b4333}

#calbar{display:none;position:absolute;left:10px;right:64px;top:10px;z-index:8;background:#2a2620f0;color:#f6efe0;border-radius:8px;padding:10px 12px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 4px 16px #0006}
#calbar.show{display:block}#calbar b{color:#ffd37a}#calbar .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}

.hint{font:12px/1.6 system-ui,sans-serif;color:var(--mute);margin:8px 2px 0}
.side{padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px)}
.side h2{font-size:17px;margin:0;border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}

#q{width:100%;padding:7px 10px;border:1px solid #c9bda4;background:#fffdf6;border-radius:4px}
.list{overflow:auto;min-height:120px;flex:1;margin:0 -6px;padding:0 6px}
.item{display:flex;width:100%;text-align:left;gap:8px;align-items:flex-start;border:0;border-bottom:1px solid #e6dcc8;background:none;padding:8px 4px;border-radius:0}
.item:hover{background:#efe6d0}.item.on{background:#2a2620;color:#fff}.item.on small{color:#d7cbb0}
.item .n{flex:1;line-height:1.35;font-size:14px}.item small{display:block;color:var(--mute);font:11.5px system-ui,sans-serif;margin-top:2px}
.item .st{font:12px system-ui,sans-serif;white-space:nowrap;color:var(--green);font-weight:700;padding-top:2px}.item.on .st{color:#9fe0b0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:10px}

.credit{font:11.5px/1.6 system-ui,sans-serif;color:var(--mute);text-align:center;padding:4px 14px 22px}
.modal{position:fixed;inset:0;background:#15120dbb;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}
.dialog{background:var(--paper);width:min(720px,100%);max-height:94vh;overflow:auto;border:1px solid #bda97c;box-shadow:0 24px 70px #0009;border-radius:6px}

.dh h2{margin:0;font-size:22px;line-height:1.3}.dh .bt{display:flex;gap:6px}
.tag{display:inline-block;background:#e9dec6;color:#6b4b2a;padding:1px 9px;font:12px system-ui,sans-serif;margin:7px 6px 0 0;border-radius:99px}

.db{padding:6px 22px 22px}

.db label{display:block;font:13px system-ui,sans-serif;color:#6f604a;margin:14px 0 5px}
.db input[type=date],.db input[type=text],.db select,.db textarea{width:100%;padding:9px 10px;border:1px solid #c9bda7;background:#fffdf7;border-radius:3px}

.db label.chk{display:flex;gap:8px;align-items:center;margin:12px 0 0;color:#6f604a}.db label.chk input{width:auto}
.vrow{font:14px system-ui,sans-serif;color:#6f604a;margin:12px 0 4px}.vnote{white-space:pre-wrap;margin:6px 0 0}.muted{color:var(--mute);font:13px system-ui,sans-serif}
.ph{display:flex;justify-content:space-between;align-items:center}
.addp{display:inline-block;background:var(--red);color:#fff;padding:6px 13px;border-radius:4px;font:13px system-ui,sans-serif;cursor:pointer}.db label.addp{color:#fff;font:13px system-ui,sans-serif;margin:12px 0 0}.addp:hover{background:var(--red2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.th{position:relative;aspect-ratio:1;background:#e3dac6;border:1px solid #cdbf9f;border-radius:4px;overflow:hidden;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th span{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font:11px/1.3 system-ui,sans-serif;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{margin-top:8px;border:2px dashed #c4b48f;border-radius:6px;padding:14px;text-align:center;color:var(--mute);font:13px system-ui,sans-serif}.drop.over{background:#f0e3bf;border-color:var(--gold)}
#saved{font:12px system-ui,sans-serif;color:var(--green);min-height:16px;margin-top:8px}
.infoForm{background:#f1e9d4;border:1px dashed #c4b48f;border-radius:6px;padding:4px 14px 14px;margin-top:12px;display:none}.infoForm.open{display:block}
.dangerbtn{border:1px solid #c98b82;color:#8f2a20;background:#fff5f2;border-radius:4px;padding:5px 11px;font-size:13px;margin-top:12px}
.lb{position:fixed;inset:0;background:#0c0a07f2;display:none;z-index:80;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px}

.lb .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}.lb button{background:#3b362d;color:#f6efe0;border:1px solid #6a6252;border-radius:4px;padding:6px 14px}.lb button.d{background:#8a2c22}
#login{z-index:90}
#login .dialog{width:min(380px,100%);padding:22px}#login h3{margin:0 0 4px;font-size:18px}#login p{margin:0 0 12px;font:13px system-ui,sans-serif;color:var(--mute)}

@media(max-width:900px){main{grid-template-columns:1fr;padding:8px}.side{position:static;max-height:none}.list{max-height:300px}#vp{height:68vh;min-height:360px}.legend{display:none}}
@media(max-width:700px){.modal{align-items:flex-end;padding:0;background:#15120d88}.dialog{width:100%;max-height:86vh;border-radius:16px 16px 0 0;animation:up .25s ease-out}.dh{padding:14px 16px 8px}.db{padding:4px 16px 24px}.dh h2{font-size:19px}}
@media(max-width:520px){header{padding:12px 14px}#lens{width:116px;height:116px}#lensTxt{width:116px;bottom:134px}}

<header><div><h1>我的广州历史遗迹寻访电子足迹地图</h1><p>私人寻访档案 · 一张图,走过的广州</p></div>
<div class="stat"><span class="editpill only-edit">✎ 编辑模式 <span id="sync" class="ok">☁ 已连接</span><button id="bOut">退出</button></span><span id="stat"></span><div class="bar"><i id="barI"></i></div></div></header>
<main>
<section class="panel mapPanel">
 <div class="toolbar" id="filters"></div>
 <div class="toolbar" style="margin-top:-2px">
  <button class="tbtn on" id="tLabels" title="在红点旁显示地点名称">名称标签:开</button>
  <button class="tbtn only-edit" id="tCal" title="拖动红点校准位置">📍 校准点位:关</button>

  <button class="tbtn" id="tCore">老城区</button><button class="tbtn" id="tAll">全图</button>
 </div>
 <div id="vp">
  <img id="base" alt="" src="tiles/preview.jpg" draggable="false"><div id="tiles"></div>
  <div id="layer"></div>
  <div id="mapLoad">地图加载中…</div>

 </div>

</section>

 <div class="tools only-edit">
  <button id="bExp">⬇ 导出数据备份</button><button id="bImp">⬆ 导入旧备份</button>
  <button id="bRst" class="w">重置全部点位到初始位置</button>
 </div>
 <input type="file" id="impFile" accept="application/json" hidden>
</aside>
</main>
<p class="credit">底图:《广州市地图(全要素版)》广东省自然资源厅监制,审图号 粤S(2022)059号 · 本站为个人寻访记录,仅作展示</p>

<div class="modal" id="modal"><div class="dialog" role="dialog" aria-modal="true">
 <div class="dh"><div><h2 id="mName"></h2><span class="tag" id="mCat"></span><span class="tag" id="mDist"></span></div>
  <div class="bt"><button class="x" id="mShare" title="复制这个地点的链接">🔗</button><button class="x" id="mClose">关闭 ✕</button></div></div>
 <div class="db">
  <p class="desc" id="mDesc"></p>
  <!-- 访客只读 -->
  <div class="only-view" id="viewBlock"></div>
  <!-- 编辑 -->

  </div>
 </div>
</div></div>

<div class="lb" id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCapTxt"></div><input id="lbCap" class="only-edit" placeholder="给这张照片写一句说明…">

<div class="modal" id="login"><div class="dialog"><h3>进入编辑模式</h3><p>请输入编辑密码。只有你自己需要这一步,访客不用。</p>

 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="x" id="loginCancel">取消</button><button class="x" style="background:var(--red);color:#fff;border-color:var(--red)" id="loginOk">进入</button></div></div></div>

 (D.photos[sid(p)]||(D.photos[sid(p)]=[])).push({id,caption:'',ts:Date.now()});return id}
async function addFiles(files){if(!cur||!EDIT)return;const p=cur;files=files.filter(f=>f.type.startsWith('image/'));if(!files.length){toast('请选择图片文件(HEIC 请先转成 JPG)');return}
 let ok=0;for(let i=0;i<files.length;i++){toast(`正在上传 ${i+1} / ${files.length} …`,{keep:true});try{await uploadPhoto(p,files[i]);ok++}catch(e){toast('有照片上传失败:'+(e.message||e));await new Promise(r=>setTimeout(r,1200))}}
 if(ok){markDirty();toast(`已添加 ${ok} 张照片`)}if(cur===p)renderGrid();renderList();layout()}
$('fPhoto').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const drop=$('drop');['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));
/* 灯箱 */
let lbI=0;function openLb(i){lbI=i;$('lb').classList.add('open');lbShow()}
function lbShow(){const a=plist(cur);if(!a.length){closeLb();return}lbI=(lbI+a.length)%a.length;const o=a[lbI];$('lbImg').src=photoURL(o.id);$('lbCap').value=o.caption||'';$('lbCapTxt').textContent=EDIT?'':(o.caption||'');$('lbIdx').textContent=`${lbI+1} / ${a.length}`}
const lbGo=d=>{lbI+=d;lbShow()};function closeLb(){$('lb').classList.remove('open');$('lbImg').src='';if(EDIT)renderGrid();else renderView();renderList()}
$('lbPrev').onclick=()=>lbGo(-1);$('lbNext').onclick=()=>lbGo(1);$('lbClose').onclick=closeLb;
$('lb').addEventListener('pointerdown',e=>{if(e.target.id==='lb')closeLb()});
let tx0=null;$('lbImg').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});$('lbImg').addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)});
$('lbCap').oninput=e=>{const o=plist(cur)[lbI];o.caption=e.target.value;markDirty()};
$('lbDel').onclick=()=>{const a=plist(cur),o=a[lbI];if(!o)return;const idx=lbI;a.splice(idx,1);markDirty();lbShow();const pid=sid(cur);
 let undone=false;const tm=setTimeout(()=>{if(!undone)api('photo/'+o.id,{method:'DELETE'})},8000);
 toast('已删除一张照片',{action:'撤销',fn:()=>{undone=true;clearTimeout(tm);(D.photos[pid]||(D.photos[pid]=[])).splice(idx,0,o);markDirty();if(cur&&sid(cur)===pid){renderGrid()}renderList();layout()},ms:8000})};
/* ---------- 备份 / 导入 / 重置 ---------- */
$('bExp').onclick=()=>{const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='广州足迹数据-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已下载(照片文件保存在云端 R2,不在这个文件里)')};
$('bImp').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text());if(j.app!=='gz-footprints')throw 0}catch(err){toast('这不是旧版的备份文件');return}
 if(!confirm('把旧备份里的参观时间、感想、点位调整和照片合并进来?(同一地点已有的内容会被旧备份覆盖)'))return;
 let n=0;for(const[id,r]of Object.entries(j.rec||{})){if(r.date||r.note){const o=D.places[id]||(D.places[id]={});if(r.date)o.date=r.date;if(r.note)o.note=r.note;n++}}
 for(const[id,q]of Object.entries(j.pos||{})){const o=D.places[id]||(D.places[id]={});o.x=q[0];o.y=q[1]}
 const ph=j.photos||[];for(let i=0;i<ph.length;i++){toast(`导入照片 ${i+1} / ${ph.length} …`,{keep:true});try{const blob=await (await fetch(ph[i].data)).blob();const p=byId(ph[i].pid)||{id:ph[i].pid};const pid=rid();
   const full=await toBlob(blob,1600,.82),th=await toBlob(blob,480,.75);let r=await api('photo/'+pid,{method:'PUT',headers:{'content-type':'image/jpeg'},body:full});if(!r.ok)throw 0;r=await api('photo/'+pid+'/t',{method:'PUT',headers:{'content-type':'image/jpeg'},body:th});if(!r.ok)throw 0;
   (D.photos[String(ph[i].pid)]||(D.photos[String(ph[i].pid)]=[])).push({id:pid,caption:ph[i].caption||'',ts:ph[i].ts||Date.now()})}catch(err){}}
 buildPlaces();markDirty();renderList();layout();toast('导入完成')};
$('bRst').onclick=()=>{if(!confirm('把全部点位恢复到初始位置?(参观时间、感想和照片不受影响)'))return;Object.values(D.places).forEach(o=>{delete o.x;delete o.y});buildPlaces();undo.length=0;markDirty();layout();renderList();updateBar()};
/* ---------- 提示条 ---------- */
let tt;function toast(m,o={}){const t=$('toast');$('toastMsg').textContent=m;const b=$('toastAct');if(o.action){b.style.display='';b.textContent=o.action;b.onclick=()=>{o.fn();t.classList.remove('show')}}else b.style.display='none';t.classList.add('show');clearTimeout(tt);if(!o.keep)tt=setTimeout(()=>t.classList.remove('show'),o.ms||2600)}
/* ---------- 登录 ---------- */
async function tryLogin(pw){try{const r=await fetch('/api/login',{method:'POST',headers:{'x-edit-password':pw}});return r.ok}catch(e){return null}}
function askLogin(){return new Promise(res=>{const m=$('login');m.classList.add('open');$('pw').value='';$('loginErr').textContent='';setTimeout(()=>$('pw').focus(),50);
 const ok=async()=>{const v=$('pw').value;if(!v)return;$('loginOk').disabled=true;const r=await tryLogin(v);$('loginOk').disabled=false;
  if(r===true){m.classList.remove('open');cleanup();res(v)}else{$('loginErr').textContent=r===null?'连不上服务器,请稍后重试':'密码不对,请再试一次'}};
 const cancel=()=>{m.classList.remove('open');cleanup();res(null)};
 const key=e=>{if(e.key==='Enter')ok()};const cleanup=()=>{$('loginOk').onclick=null;$('loginCancel').onclick=null;$('pw').removeEventListener('keydown',key)};
 $('loginOk').onclick=ok;$('loginCancel').onclick=cancel;$('pw').addEventListener('keydown',key)})}
$('bOut').onclick=()=>{try{localStorage.removeItem('gz-edit-pw')}catch(e){}location.href=location.pathname};
/* ---------- 启动 ---------- */
async function loadData(){try{const r=await api('data'+(EDIT?'?full=1':''));if(r.ok){D=Object.assign(emptyD(),await r.json());cloudOK=true;return true}if(r.status===401&&EDIT){return 'auth'}}catch(e){}cloudOK=false;return false}
(async function(){
 setLabBtn();setHint();renderFilters();buildPlaces();renderList();setLimits();
 const want=new URLSearchParams(location.search).has('edit');
 if(want){let pw='';try{pw=localStorage.getItem('gz-edit-pw')||''}catch(e){}
  if(!pw||(await tryLogin(pw))!==true)pw=await askLogin();
  if(pw){PW=pw;EDIT=true;try{localStorage.setItem('gz-edit-pw',pw)}catch(e){}document.body.classList.add('edit')}}
 const r=await loadData();
 if(r==='auth'){EDIT=false;PW='';document.body.classList.remove('edit');try{localStorage.removeItem('gz-edit-pw')}catch(e){}await loadData()}
 if(!cloudOK&&EDIT){setSync('err','⚠ 无法连接云端');toast('无法连接云端,当前改动不会被保存')}
 buildPlaces();renderFilters();renderList();fitCore(false);
 const m=location.hash.match(/#p=([\w-]+)/);if(m){const p=byId(m[1]);if(p){flyTo(p,.5);openPlace(p)}}
})();
